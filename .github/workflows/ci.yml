# Confere o código a cada envio ao GitHub, antes de ele chegar à VM.
#
# O que isto teria pegado: o build que quebrou por importar `node:crypto` no
# módulo errado só apareceu no `docker compose build` da VM.
name: Conferência

on:
  push:
    branches: [main, feat/base-do-sistema]
  pull_request:

# O token que o GitHub entrega ao job só lê o código. Sem isto ele podia, por
# padrão, escrever no repositório: um passo comprometido (uma ação de terceiros
# trocada, uma dependência infectada no npm ci) sairia com poder de publicar
# código. Apontado pelo CodeQL em 11/11/2026.
permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # As ações vão fixadas pelo commit, e não pela etiqueta: etiqueta pode ser
      # movida por quem invadir o repositório da ação (tj-actions em 2025,
      # trivy-action em 2026). O Dependabot atualiza o commit e o comentário.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O token não fica gravado no disco do job depois do checkout.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Regras (sem banco)
        run: npm run testar:regras
      - name: Falhas críticas nas dependências de produção
        run: npm audit --omit=dev --audit-level=critical
      - name: Build de produção
        run: npm run build
        env:
          # Valores de mentira: o build não fala com o banco, só precisa que existam.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
