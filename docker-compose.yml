# Selebi em produção: banco, site, coletor e HTTPS.
#
#   docker compose up -d --build
#   docker compose logs -f coletor
#
# Precisa de um `.env` ao lado deste arquivo. Veja `.env.example`.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bbsolucoes}
      TZ: America/Sao_Paulo
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    # SEM `ports`, e isso é a linha mais importante do arquivo.
    #
    # Publicar a 5432 no host deixaria o Postgres exposto na internet assim que
    # a VM ganhar IP público — e Postgres com porta aberta é varrido por robô em
    # questão de horas. Aqui ele só existe dentro da rede do compose, alcançável
    # pelo site e pelo coletor, por mais ninguém.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-bbsolucoes}"]
      interval: 10s
      timeout: 5s
      retries: 10

  site:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro do compose o banco atende pelo nome do serviço, na 5432 — a porta
      # 5434 do desenvolvimento era desvio para não bater no Postgres nativo do
      # Windows, e aqui não existe esse problema.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bbsolucoes}
      PG_CONTAINER: ""
    depends_on:
      db:
        condition: service_healthy
    # SEM `ports` também: quem fala com a internet é o Caddy, e ele alcança o
    # site por dentro da rede. Sem isso, a 3000 ficaria aberta em HTTP puro ao
    # lado do HTTPS, e login por HTTP é senha trafegando aberta.

  coletor:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bbsolucoes}
      # A cópia de segurança roda dentro deste container, falando com o `db`
      # pela rede — não há Docker aqui dentro para fazer `docker exec`.
      PG_HOST: db
      PG_CONTAINER: ""
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
    # Uma rodada por hora, e a primeira ao subir.
    #
    # Sem daemon de cron de propósito: um laço de shell aparece no
    # `docker compose logs` como qualquer outra coisa, enquanto cron escreve
    # num log próprio que ninguém lembra de abrir. A precisão não importa —
    # cada coletor tem sua própria trava de cadência e as etapas se recusam
    # sozinhas fora do horário de sol.
    command: >
      sh -c 'while true; do
        echo "--- rodada $$(date "+%d/%m %H:%M") ---";
        npm run atualizar || echo "a rodada falhou, seguindo para a próxima";
        sleep 3600;
      done'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # O domínio que aponta para esta VM. O Caddy pede o certificado sozinho.
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - site

volumes:
  dados-postgres:
  caddy-dados:
  caddy-config:
